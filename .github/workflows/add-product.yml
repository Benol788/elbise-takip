name: Urun Ekle

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Trendyol urun linki veya urun kodu"
        required: true
        type: string
      min_price:
        description: "Alt fiyat, ornek: 400"
        required: false
        type: string
      max_price:
        description: "Ust fiyat, ornek: 500"
        required: false
        type: string

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Urunu config dosyasina ekle
        run: python src/add_product.py --config config.json --product "${{ inputs.product }}" --min-price "${{ inputs.min_price }}" --max-price "${{ inputs.max_price }}"

      - name: Urunleri kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python src/dress_watch.py --config config.json --once

      - name: Degisikligi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json data/state.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
          else
            git commit -m "Add product ${{ inputs.product }}"
            git pull --rebase
            git push
          fi
