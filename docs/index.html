<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elbise Stok Takip</title>
    <script src="./app-config.js?v=note1"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap");

      :root {
        --text: #18264f;
        --muted: #61708a;
        --panel: rgba(255, 255, 255, 0.9);
        --border: #dbe4f3;
        --blue: #527cff;
        --blue-soft: #eaf0ff;
        --dark: #2f3b4f;
        --red: #f54f63;
        --green: #18b978;
        --yellow: #f5a300;
        --shadow: 0 18px 42px rgba(44, 62, 100, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 10%, rgba(92, 135, 255, 0.25), transparent 24rem),
          radial-gradient(circle at 90% 8%, rgba(255, 110, 173, 0.28), transparent 24rem),
          radial-gradient(circle at 50% 100%, rgba(80, 210, 170, 0.18), transparent 28rem),
          linear-gradient(135deg, #eef5ff 0%, #fff4fb 48%, #f5fbff 100%);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(48, 74, 130, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(48, 74, 130, 0.045) 1px, transparent 1px);
        background-size: 34px 34px;
      }

      main {
        position: relative;
        z-index: 2;
        width: min(960px, calc(100% - 24px));
        margin: 0 auto;
        padding: 16px 0 44px;
      }

      header,
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 18px 18px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 36px);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1.05;
      }

      h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0;
      }

      h2::before {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        font-weight: 800;
      }

      section:nth-of-type(1) h2::before {
        content: "+";
        background: linear-gradient(135deg, #ff7ab6, #6bd6a5);
      }

      section:nth-of-type(2) h2::before {
        content: "=";
        background: linear-gradient(135deg, #55c7d8, #7d8cff);
      }

      .status {
        min-width: 132px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        text-align: center;
      }

      section {
        position: relative;
        padding: 16px;
        margin-bottom: 16px;
        overflow: hidden;
      }

      section::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: linear-gradient(90deg, #ff74b7, #7a9cff, #6bd6a5);
      }

      section::after {
        content: "";
        position: absolute;
        inset: 18px;
        opacity: 0.08;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 18px 24px, #ff4f9a 0 5px, transparent 6px),
          radial-gradient(circle at 8px 12px, #ff4f9a 0 3px, transparent 4px),
          radial-gradient(circle at 18px 7px, #ff4f9a 0 3px, transparent 4px),
          radial-gradient(circle at 28px 12px, #ff4f9a 0 3px, transparent 4px);
        background-size: 150px 105px;
        transform: rotate(-6deg);
      }
      
      form {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.6fr 0.95fr 0.55fr 0.55fr 0.65fr 0.75fr;
        gap: 12px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: #4c5970;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid #d7e1f0;
        border-radius: 13px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        outline: none;
      }

      input::placeholder {
        color: #7b8495;
      }

      input:focus,
      select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(79, 124, 255, 0.14);
      }

      .wide {
        grid-column: span 2;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: end;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 13px;
        padding: 0 15px;
        background: var(--blue);
        color: white;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(79, 124, 255, 0.22);
        transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      }

      button.secondary {
        background: var(--dark);
        box-shadow: 0 12px 24px rgba(47, 59, 79, 0.16);
      }

      button.danger {
        background: var(--red);
        box-shadow: 0 12px 24px rgba(245, 79, 99, 0.2);
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(47, 59, 79, 0.18);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid var(--border);
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      .message.ok {
        display: block;
        color: #087f5b;
        border-color: #9ee4c0;
      }

      .message.err {
        display: block;
        color: #c92a2a;
        border-color: #f3aab4;
      }

      .list {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 12px;
      }

      .product {
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(250, 252, 255, 0.74));
        box-shadow: 0 10px 24px rgba(44, 62, 100, 0.07);
      }

      .product::before {
        content: "";
        grid-row: 1;
        width: 6px;
        align-self: stretch;
        border-radius: 999px;
        background: linear-gradient(#ff74b7, #6bd6a5);
      }

      .product::after {
        content: "";
        position: absolute;
        inset: 10px 18px;
        opacity: 0.16;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 18px 24px, #0b78d0 0 5px, transparent 6px),
          radial-gradient(circle at 8px 12px, #0b78d0 0 3px, transparent 4px),
          radial-gradient(circle at 18px 7px, #0b78d0 0 3px, transparent 4px),
          radial-gradient(circle at 28px 12px, #0b78d0 0 3px, transparent 4px);
       background-size: 130px 92px;
       background-position:
         0 0,
         0 0,
         0 0,
         0 0;
       transform: rotate(-8deg);
     }

      .product > * {
        position: relative;
        z-index: 1;
      }

      .product > .product-body {
        grid-column: 1;
      }

      .product.target-hit {
        border-color: rgba(24, 185, 120, 0.78);
        background: linear-gradient(135deg, rgba(214, 255, 235, 0.98), rgba(235, 255, 245, 0.94));
      }

      .product.favorite {
        border-color: rgba(245, 163, 0, 0.82);
        background: linear-gradient(135deg, rgba(255, 245, 204, 0.98), rgba(255, 238, 210, 0.95));
      }

      .product.paused {
        opacity: 0.58;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .star {
        color: #f2a000;
        font-size: 19px;
        line-height: 1;
        text-shadow: 0 1px 4px rgba(245, 163, 0, 0.28);
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        border-radius: 999px;
        padding: 4px 9px;
        background: #dff8ea;
        color: #087f5b;
        font-size: 13px;
        font-weight: 800;
      }

      .badge.paused-badge {
        background: #eef1f6;
        color: #61708a;
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.28;
        overflow-wrap: anywhere;
      }

      .product-link {
        display: inline-flex;
        width: fit-content;
        margin-top: 6px;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--blue-soft);
        color: #1f63e9;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      .product-actions {
        display: grid;
        gap: 8px;
      }

      .product-actions button {
        min-width: 118px;
      }

      .empty {
        padding: 24px 14px;
        color: var(--muted);
        text-align: center;
      }

      .decor {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      .flower,
      .butterfly,
      .bee {
        position: absolute;
        opacity: 0.75;
      }

      .flower {
        width: 120px;
        height: 150px;
      }

      .flower::before {
        content: "";
        position: absolute;
        left: 52px;
        top: 58px;
        width: 10px;
        height: 110px;
        border-radius: 999px;
        background: rgba(79, 155, 138, 0.45);
      }

      .flower::after {
        content: "";
        position: absolute;
        left: 42px;
        top: 40px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffe585;
        box-shadow:
          -34px -8px 0 16px rgba(255, 125, 178, 0.38),
          2px -30px 0 17px rgba(255, 125, 178, 0.35),
          34px -8px 0 16px rgba(255, 125, 178, 0.36),
          24px 28px 0 18px rgba(255, 125, 178, 0.33),
          -26px 28px 0 18px rgba(255, 125, 178, 0.34);
      }

      .flower.blue::after {
        box-shadow:
          -30px -8px 0 14px rgba(112, 146, 255, 0.32),
          4px -29px 0 15px rgba(112, 146, 255, 0.28),
          34px -8px 0 14px rgba(112, 146, 255, 0.3),
          24px 27px 0 16px rgba(112, 146, 255, 0.29),
          -26px 27px 0 16px rgba(112, 146, 255, 0.31);
      }

      .flower.green::after {
        box-shadow:
          -30px -8px 0 15px rgba(88, 207, 169, 0.28),
          4px -29px 0 16px rgba(88, 207, 169, 0.25),
          34px -8px 0 15px rgba(88, 207, 169, 0.27),
          24px 27px 0 17px rgba(88, 207, 169, 0.25),
          -26px 27px 0 17px rgba(88, 207, 169, 0.27);
      }

      .butterfly {
        width: 42px;
        height: 36px;
      }

      .butterfly::before {
        content: "";
        position: absolute;
        inset: 8px 18px 4px;
        width: 5px;
        border-radius: 999px;
        background: rgba(58, 68, 96, 0.35);
        transform: rotate(-16deg);
      }

      .butterfly::after {
        content: "";
        position: absolute;
        left: 8px;
        top: 8px;
        width: 16px;
        height: 13px;
        border-radius: 70% 50%;
        background: rgba(255, 103, 162, 0.45);
        box-shadow:
          15px -3px 0 1px rgba(255, 103, 162, 0.38),
          0 13px 0 -1px rgba(101, 151, 255, 0.35),
          17px 11px 0 -1px rgba(101, 151, 255, 0.32);
      }

      .bee {
        width: 44px;
        height: 30px;
      }

      .bee::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 9px;
        width: 30px;
        height: 16px;
        border-radius: 999px;
        background:
          linear-gradient(90deg, transparent 0 22%, rgba(61, 51, 53, 0.7) 22% 34%, transparent 34% 53%, rgba(61, 51, 53, 0.7) 53% 65%, transparent 65%),
          #ffd45c;
      }

      .bee::after {
        content: "";
        position: absolute;
        left: 14px;
        top: 1px;
        width: 13px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 12px 0 0 rgba(255, 255, 255, 0.5);
      }

      .flower-left {
        left: -44px;
        bottom: 48px;
      }

      .flower-left-small {
        left: 6px;
        bottom: -16px;
      }

      .flower-right {
        right: -48px;
        bottom: 74px;
      }

      .flower-right-small {
        right: 12px;
        bottom: -20px;
      }

      .flower-bottom {
        left: 46%;
        bottom: -92px;
      }

      .butterfly-left {
        left: 42px;
        top: 23%;
      }

      .butterfly-right {
        right: 46px;
        top: 13%;
      }

      .butterfly-small {
        right: 24px;
        top: 39%;
        transform: scale(0.8);
      }

      .bee-one {
        right: 132px;
        top: 28%;
      }

      @media (max-width: 860px) {
        main {
          width: min(100% - 18px, 960px);
          padding-top: 12px;
        }

        header {
          padding: 14px;
        }

        form {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }

        .wide {
          grid-column: span 2;
        }

        .actions {
          grid-column: span 2;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
        }

        .product {
          grid-template-columns: 1fr;
          padding: 12px;
        }

        .product-actions {
          grid-template-columns: 1fr 1fr;
        }

        .product-actions button {
          min-width: 0;
          width: 100%;
        }

        .flower {
          transform: scale(0.78);
        }

        .bee-one,
        .butterfly-left,
        .butterfly-right {
          opacity: 0.45;
        }
      }

      @media (max-width: 520px) {
        header {
          align-items: flex-start;
        }

        .status {
          min-width: 92px;
          padding: 9px 12px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .wide,
        .actions {
          grid-column: auto;
        }

        .actions {
          grid-template-columns: 1fr 1fr;
        }

        .product-actions {
          grid-template-columns: 1fr;
        }

        .flower-left,
        .flower-right {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="decor" aria-hidden="true">
      <span class="flower flower-left"></span>
      <span class="flower blue flower-left-small"></span>
      <span class="flower flower-right"></span>
      <span class="flower green flower-right-small"></span>
      <span class="flower blue flower-bottom"></span>
      <span class="butterfly butterfly-left"></span>
      <span class="butterfly butterfly-right"></span>
      <span class="butterfly butterfly-small"></span>
      <span class="bee bee-one"></span>
    </div>

    <main>
      <header>
        <h1>Elbise Stok Takip</h1>
        <div id="status" class="status">Bağlanıyor</div>
      </header>

      <div id="message" class="message"></div>

      <section>
        <h2>Ürün Ekle</h2>
        <form id="add-form">
          <input id="editing-id" type="hidden" />

          <label class="wide">
            Ürün adı
            <input id="name" autocomplete="off" placeholder="Mavi elbise" />
          </label>

          <label>
            Ürün linki veya kodu
            <input id="product" autocomplete="off" placeholder="https://... veya 1072453822" required />
          </label>

          <label>
            Alt fiyat
            <input id="min-price" inputmode="numeric" placeholder="500" required />
          </label>

          <label>
            Üst fiyat
            <input id="max-price" inputmode="numeric" placeholder="800" required />
          </label>

          <label>
            Beden
            <input id="sizes" autocomplete="off" placeholder="M,L veya 34,36" />
          </label>

          <label>
            Renk
            <input id="colors" autocomplete="off" placeholder="mavi,lacivert" />
          </label>

          <label class="wide">
            Bildirim tipi
            <select id="alert-mode">
              <option value="price_stock">Fiyat + stok uygunsa</option>
              <option value="stock">Sadece stok varsa</option>
              <option value="price">Sadece fiyat uygunsa</option>
            </select>
          </label>

          <div class="actions">
            <button id="submit-button" type="submit">Ürün Ekle</button>
            <button class="secondary" id="refresh" type="button">Yenile</button>
            <button class="secondary" id="cancel-edit" type="button" hidden>Vazgeç</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Takip Listesi</h2>
        <div id="products" class="list">
          <div class="empty">Liste yükleniyor.</div>
        </div>
      </section>
    </main>

    <script>
      const config = window.APP_CONFIG || {};
      const statusEl = document.querySelector("#status");
      const messageEl = document.querySelector("#message");
      const listEl = document.querySelector("#products");
      const formEl = document.querySelector("#add-form");
      const refreshEl = document.querySelector("#refresh");
      const editingIdEl = document.querySelector("#editing-id");
      const submitButtonEl = document.querySelector("#submit-button");
      const cancelEditEl = document.querySelector("#cancel-edit");
      let currentRows = [];

      function apiUrl(path = "") {
        return `${config.supabaseUrl.replace(/\/$/, "")}/rest/v1/products${path}`;
      }

      function headers(extra = {}) {
        return {
          apikey: config.supabaseAnonKey,
          Authorization: `Bearer ${config.supabaseAnonKey}`,
          "Content-Type": "application/json",
          ...extra
        };
      }

      function showMessage(text, type = "ok") {
        messageEl.textContent = text;
        messageEl.className = `message ${type}`;
      }

      function clearMessage() {
        messageEl.textContent = "";
        messageEl.className = "message";
      }

      function productIdFrom(value) {
        const text = value.trim();
        const match = text.match(/-p-(\d+)/);
        if (match) return match[1];
        if (/^https?:\/\//i.test(text)) return "";
        return text.replace(/\D/g, "");
      }

      function listFrom(value) {
        return value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function rowTitle(row) {
        return row.name || row.product_id || row.product_url || "Ürün";
      }

      function checkedAtText(value) {
        if (!value) return "Son kontrol: henüz yok";

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Son kontrol: bilinmiyor";

        const diffMs = Date.now() - date.getTime();
        const diffMinutes = Math.max(0, Math.floor(diffMs / 60000));

        if (diffMinutes < 1) return "Son kontrol: az önce";
        if (diffMinutes < 60) return `Son kontrol: ${diffMinutes} dk önce`;
 
        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) return `Son kontrol: ${diffHours} saat önce`;

        const diffDays = Math.floor(diffHours / 24);
        return `Son kontrol: ${diffDays} gün önce`;
      }

      function alertModeText(value) {
        if (value === "stock") return "Bildirim: sadece stok";
        if (value === "price") return "Bildirim: sadece fiyat";
        return "Bildirim: fiyat + stok";
      }

      function isTargetHit(row) {
        const price = Number(row.last_price);
        const minPrice = Number(row.target_price_min);
        const maxPrice = Number(row.target_price_max);
        const priceOk = Number.isFinite(price) && price >= minPrice && price <= maxPrice;
        const stockOk = row.last_stock_status === "var";
        return priceOk && stockOk && !row.is_paused;
      }

      function productRef(row) {
        return row.product_url || row.product_id || row.id;
      }

      function linkHtml(row) {
        const ref = productRef(row);
        if (!row.product_url) return `<span class="meta">${ref}</span>`;
        return `<a class="product-link" href="${row.product_url}" target="_blank" rel="noreferrer">Ürünü aç</a>`;
      }

      function exitEditMode() {
        editingIdEl.value = "";
        submitButtonEl.textContent = "Ürün Ekle";
        cancelEditEl.hidden = true;
        formEl.reset();
      }

      function renderProducts(rows) {
        if (!rows.length) {
          listEl.innerHTML = '<div class="empty">Henüz ürün yok.</div>';
          return;
        }

        const sortedRows = [...rows].sort((a, b) => {
          return Number(isTargetHit(b)) - Number(isTargetHit(a)) || Number(b.is_favorite) - Number(a.is_favorite);
        });

        listEl.innerHTML = sortedRows
          .map((row) => {
            const price = `${Number(row.target_price_min)}-${Number(row.target_price_max)} TL`;
            const sizes = Array.isArray(row.target_sizes) && row.target_sizes.length
              ? `Beden: ${row.target_sizes.join(", ")}`
              : "Beden: fark etmez";
            const colors = Array.isArray(row.color_keywords) && row.color_keywords.length
              ? `Renk: ${row.color_keywords.join(", ")}`
              : "Renk: fark etmez";
            const lastPrice = row.last_price
              ? `Son fiyat: ${Number(row.last_price)} ${row.last_currency || "TL"}`
              : "Son fiyat: henüz yok";
            const lastStock = row.last_stock_status
              ? `Stok: ${row.last_stock_status}`
              : "Stok: henüz yok";
            const lastStatus = row.last_status ? `Durum: ${row.last_status}` : "";
            const lastChecked = checkedAtText(row.last_checked_at);
            const hit = isTargetHit(row);
            const classes = [
              "product",
              hit ? "target-hit" : "",
              row.is_favorite ? "favorite" : "",
              row.is_paused ? "paused" : ""
            ].filter(Boolean).join(" ");

            return `
              <article class="${classes}">
                <div class="product-body">
                  <div class="title">
                    ${row.is_favorite ? '<span class="star">★</span>' : ""}
                    ${rowTitle(row)}
                    ${hit ? '<span class="badge">Uygun</span>' : ""}
                    ${row.is_paused ? '<span class="badge paused-badge">Duraklatıldı</span>' : ""}
                  </div>
                  <div class="meta">${price}</div>
                  <div class="meta">${sizes}</div>
                  <div class="meta">${colors}</div>
                  <div class="meta">${alertModeText(row.alert_mode)}</div>
                  <div class="meta">${lastPrice}</div>
                  <div class="meta">${lastStock}</div>
                  <div class="meta">${lastChecked}</div>
                  ${lastStatus ? `<div class="meta">${lastStatus}</div>` : ""}
                  ${linkHtml(row)}
                </div>
                <div class="product-actions">
                  <button class="secondary" data-favorite-id="${row.id}" type="button">${row.is_favorite ? "Favoriden çıkar" : "Favori"}</button>
                  <button class="secondary" data-pause-id="${row.id}" type="button">${row.is_paused ? "Devam et" : "Duraklat"}</button>
                  <button class="secondary" data-edit-id="${row.id}" type="button">Düzenle</button>
                  <button class="danger" data-id="${row.id}" type="button">Sil</button>
                </div>
              </article>
            `;
          })
          .join("");
      }

      async function loadProducts() {
        clearMessage();
        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          statusEl.textContent = "Ayar eksik";
          listEl.innerHTML = '<div class="empty">Supabase ayarları yapılmamış.</div>';
          return;
        }

        statusEl.textContent = "Yükleniyor";
        const response = await fetch(apiUrl("?select=*&order=created_at.asc"), {
          headers: headers()
        });
        if (!response.ok) throw new Error("Liste alınamadı.");
        currentRows = await response.json();
        renderProducts(currentRows);
        statusEl.textContent = `${currentRows.length} ürün`;
      }

      async function saveProduct(event) {
        event.preventDefault();
        clearMessage();

        const editingId = editingIdEl.value;
        const name = document.querySelector("#name").value.trim();
        const productValue = document.querySelector("#product").value.trim();
        const minPrice = Number(document.querySelector("#min-price").value.replace(",", "."));
        const maxPrice = Number(document.querySelector("#max-price").value.replace(",", "."));
        const sizes = listFrom(document.querySelector("#sizes").value);
        const colors = listFrom(document.querySelector("#colors").value).map((color) => color.toLowerCase());
        const alertMode = document.querySelector("#alert-mode").value;

        if (!productValue || !Number.isFinite(minPrice) || !Number.isFinite(maxPrice)) {
          showMessage("Ürün ve fiyat aralığını doldur.", "err");
          return;
        }

        const productId = productIdFrom(productValue);
        const productUrl = /^https?:\/\//i.test(productValue) ? productValue : "";
        const duplicate = currentRows.find((row) => {
          if (editingId && row.id === editingId) return false;
          return (productId && row.product_id === productId) || (productUrl && row.product_url === productUrl);
        });

        if (duplicate) {
          showMessage("Bu ürün zaten listede var.", "err");
          return;
        }

        const payload = {
          name: name,
          product_url: productUrl,
          product_id: productId,
          target_price_min: minPrice,
          target_price_max: maxPrice,
          target_sizes: sizes,
          color_keywords: colors,
          alert_mode: alertMode
        };

        const response = await fetch(
          editingId ? apiUrl(`?id=eq.${encodeURIComponent(editingId)}`) : apiUrl(),
          {
            method: editingId ? "PATCH" : "POST",
            headers: headers({ Prefer: "return=minimal" }),
            body: JSON.stringify(payload)
          }
        );
        if (!response.ok) throw new Error(editingId ? "Ürün güncellenemedi." : "Ürün eklenemedi.");

        showMessage(editingId ? "Ürün güncellendi." : "Ürün takip listesine eklendi.");
        exitEditMode();
        await loadProducts();
      }

      function editProduct(id) {
        const row = currentRows.find((item) => item.id === id);
        if (!row) {
          showMessage("Düzenlenecek ürün bulunamadı.", "err");
          return;
        }

        editingIdEl.value = row.id;
        document.querySelector("#name").value = row.name || "";
        document.querySelector("#product").value = row.product_url || row.product_id || "";
        document.querySelector("#min-price").value = row.target_price_min ?? "";
        document.querySelector("#max-price").value = row.target_price_max ?? "";
        document.querySelector("#sizes").value = Array.isArray(row.target_sizes) ? row.target_sizes.join(",") : "";
        document.querySelector("#colors").value = Array.isArray(row.color_keywords) ? row.color_keywords.join(",") : "";
        document.querySelector("#alert-mode").value = row.alert_mode || "price_stock";
        submitButtonEl.textContent = "Kaydet";
        cancelEditEl.hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function toggleFavorite(id) {
        const row = currentRows.find((item) => item.id === id);
        if (!row) {
          showMessage("Ürün bulunamadı.", "err");
          return;
        }

        const response = await fetch(apiUrl(`?id=eq.${encodeURIComponent(id)}`), {
          method: "PATCH",
          headers: headers({ Prefer: "return=minimal" }),
          body: JSON.stringify({ is_favorite: !row.is_favorite })
        });
        if (!response.ok) throw new Error("Favori bilgisi güncellenemedi.");

        await loadProducts();
      }

      async function togglePaused(id) {
        const row = currentRows.find((item) => item.id === id);
        if (!row) {
          showMessage("Ürün bulunamadı.", "err");
          return;
        }

        const response = await fetch(apiUrl(`?id=eq.${encodeURIComponent(id)}`), {
          method: "PATCH",
          headers: headers({ Prefer: "return=minimal" }),
          body: JSON.stringify({ is_paused: !row.is_paused })
        });
        if (!response.ok) throw new Error("Duraklatma bilgisi güncellenemedi.");

        await loadProducts();
      }

      async function removeProduct(id) {
        clearMessage();
        const response = await fetch(apiUrl(`?id=eq.${encodeURIComponent(id)}`), {
          method: "DELETE",
          headers: headers()
        });
        if (!response.ok) throw new Error("Ürün silinemedi.");
        showMessage("Ürün listeden silindi.");
        await loadProducts();
      }

      formEl.addEventListener("submit", (event) => {
        saveProduct(event).catch((error) => showMessage(error.message, "err"));
      });

      refreshEl.addEventListener("click", () => {
        loadProducts().catch((error) => showMessage(error.message, "err"));
      });

      cancelEditEl.addEventListener("click", () => {
        exitEditMode();
        clearMessage();
      });

      listEl.addEventListener("click", (event) => {
        const favoriteButton = event.target.closest("button[data-favorite-id]");
        if (favoriteButton) {
          toggleFavorite(favoriteButton.dataset.favoriteId).catch((error) => showMessage(error.message, "err"));
          return;
        }

        const pauseButton = event.target.closest("button[data-pause-id]");
        if (pauseButton) {
          togglePaused(pauseButton.dataset.pauseId).catch((error) => showMessage(error.message, "err"));
          return;
        }

        const editButton = event.target.closest("button[data-edit-id]");
        if (editButton) {
          editProduct(editButton.dataset.editId);
          return;
        }

        const button = event.target.closest("button[data-id]");
        if (!button) return;
        removeProduct(button.dataset.id).catch((error) => showMessage(error.message, "err"));
      });

      loadProducts().catch((error) => showMessage(error.message, "err"));
    </script>
  </body>
</html>
