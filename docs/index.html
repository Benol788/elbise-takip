<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elbise Stok Takip</title>
    <script src="./app-config.js"></script>
    <style>
      :root {
        --bg: #f5f7fc;
        --text: #111827;
        --muted: #687385;
        --panel: rgba(255, 255, 255, 0.94);
        --border: #d9e1ee;
        --blue: #1f63e9;
        --red: #c92a2a;
        --green: #087f5b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(99, 149, 255, 0.35), transparent 25rem),
          radial-gradient(circle at 88% 9%, rgba(255, 117, 166, 0.32), transparent 24rem),
          radial-gradient(circle at 52% 100%, rgba(89, 191, 148, 0.22), transparent 30rem),
          linear-gradient(180deg, #fff7fb 0, #edf4ff 18rem, var(--bg) 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(31, 99, 233, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 80, 139, 0.045) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent 72%);
      }

      .decor {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }

      main {
        position: relative;
        z-index: 2;
        width: min(960px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 36px;
      }

      .flower {
        position: absolute;
        width: var(--size);
        height: var(--size);
        opacity: 0.66;
        filter: drop-shadow(0 14px 22px rgba(72, 84, 116, 0.13));
      }

      .flower::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 50%, #ffe58a 0 7%, transparent 7.8%),
          radial-gradient(ellipse at 50% 22%, var(--petal) 0 18%, transparent 18.8%),
          radial-gradient(ellipse at 78% 38%, var(--petal) 0 18%, transparent 18.8%),
          radial-gradient(ellipse at 67% 74%, var(--petal) 0 18%, transparent 18.8%),
          radial-gradient(ellipse at 33% 74%, var(--petal) 0 18%, transparent 18.8%),
          radial-gradient(ellipse at 22% 38%, var(--petal) 0 18%, transparent 18.8%);
      }

      .flower::after {
        content: "";
        position: absolute;
        left: 49%;
        top: 63%;
        width: 8%;
        height: 70%;
        border-radius: 999px;
        background: rgba(8, 127, 91, 0.36);
        transform: rotate(var(--stem));
        transform-origin: top;
      }

      .flower-left-large {
        --size: 175px;
        --petal: rgba(255, 95, 151, 0.52);
        --stem: 16deg;
        left: -58px;
        bottom: 128px;
        transform: rotate(-16deg);
      }

      .flower-left-small {
        --size: 115px;
        --petal: rgba(91, 136, 255, 0.38);
        --stem: -10deg;
        left: 22px;
        bottom: 28px;
        transform: rotate(14deg);
      }

      .flower-right-large {
        --size: 215px;
        --petal: rgba(255, 111, 173, 0.44);
        --stem: -18deg;
        right: -76px;
        bottom: 80px;
        transform: rotate(18deg);
      }

      .flower-right-small {
        --size: 128px;
        --petal: rgba(83, 190, 148, 0.34);
        --stem: 12deg;
        right: 44px;
        bottom: -20px;
        transform: rotate(-8deg);
      }

      .flower-bottom {
        --size: 142px;
        --petal: rgba(158, 111, 255, 0.3);
        --stem: 0deg;
        left: 49%;
        bottom: -74px;
        transform: translateX(-50%) rotate(5deg);
      }

      .butterfly {
        position: absolute;
        width: var(--size);
        height: calc(var(--size) * 0.7);
        opacity: 0.7;
        transform: rotate(var(--rotate));
        filter: drop-shadow(0 10px 14px rgba(72, 84, 116, 0.12));
      }

      .butterfly::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 35% 36%, var(--wing-a) 0 25%, transparent 26%),
          radial-gradient(ellipse at 65% 36%, var(--wing-a) 0 25%, transparent 26%),
          radial-gradient(ellipse at 39% 70%, var(--wing-b) 0 17%, transparent 18%),
          radial-gradient(ellipse at 61% 70%, var(--wing-b) 0 17%, transparent 18%),
          linear-gradient(90deg, transparent 47%, rgba(78, 58, 91, 0.72) 47% 53%, transparent 53%);
      }

      .butterfly-one {
        --size: 64px;
        --rotate: -18deg;
        --wing-a: rgba(255, 95, 151, 0.46);
        --wing-b: rgba(91, 136, 255, 0.33);
        right: 78px;
        top: 112px;
      }

      .butterfly-two {
        --size: 48px;
        --rotate: 22deg;
        --wing-a: rgba(91, 136, 255, 0.36);
        --wing-b: rgba(255, 95, 151, 0.36);
        left: 42px;
        top: 210px;
      }

      .butterfly-three {
        --size: 42px;
        --rotate: -8deg;
        --wing-a: rgba(83, 190, 148, 0.3);
        --wing-b: rgba(255, 190, 92, 0.42);
        right: 28px;
        top: 360px;
      }

      .bee {
        position: absolute;
        right: 132px;
        top: 252px;
        width: 54px;
        height: 36px;
        opacity: 0.72;
        transform: rotate(10deg);
        filter: drop-shadow(0 10px 14px rgba(72, 84, 116, 0.12));
      }

      .bee::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 10px;
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background:
          linear-gradient(90deg, #f7c948 0 24%, #2f2933 24% 36%, #f7c948 36% 58%, #2f2933 58% 70%, #f7c948 70% 100%);
      }

      .bee::after {
        content: "";
        position: absolute;
        left: 12px;
        top: 1px;
        width: 24px;
        height: 14px;
        border-radius: 999px 999px 45% 45%;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 15px 2px 0 rgba(255, 255, 255, 0.55);
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 30px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      .status {
        min-width: 132px;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        font-size: 14px;
        color: var(--muted);
        text-align: center;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 14px 34px rgba(34, 49, 84, 0.11);
        backdrop-filter: blur(8px);
      }

      h2 {
        margin: 0 0 14px;
        font-size: 20px;
      }

      form {
        display: grid;
        grid-template-columns: 1.5fr 0.6fr 0.6fr;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 16px;
        color: var(--text);
        background: #fff;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        padding: 0 14px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: var(--blue);
        cursor: pointer;
      }

      button.danger {
        background: var(--red);
      }

      button.secondary {
        background: #343942;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        align-items: end;
        gap: 10px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .product {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fbfcfe;
      }

      .title {
        margin-bottom: 5px;
        font-weight: 700;
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .empty {
        padding: 18px;
        color: var(--muted);
        text-align: center;
      }

      .message {
        display: none;
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .message.ok {
        display: block;
        border-color: #a6d8bf;
        color: var(--green);
      }

      .message.err {
        display: block;
        border-color: #efb5af;
        color: var(--red);
      }

      @media (max-width: 760px) {
        header,
        form,
        .product {
          grid-template-columns: 1fr;
        }

        header {
          display: block;
        }

        .status {
          margin-top: 12px;
          text-align: left;
        }

        .actions {
          display: grid;
        }

        .flower-left-large {
          left: -98px;
          bottom: 150px;
        }

        .flower-left-small {
          left: -42px;
          bottom: 22px;
        }

        .flower-right-large {
          right: -126px;
          bottom: 98px;
        }

        .flower-right-small {
          right: -34px;
          bottom: -28px;
        }

        .flower-bottom {
          opacity: 0.42;
        }

        .butterfly-one {
          right: 16px;
          top: 94px;
        }

        .butterfly-two {
          left: 10px;
          top: 180px;
        }

        .butterfly-three,
        .bee {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="decor" aria-hidden="true">
      <span class="flower flower-left-large"></span>
      <span class="flower flower-left-small"></span>
      <span class="flower flower-right-large"></span>
      <span class="flower flower-right-small"></span>
      <span class="flower flower-bottom"></span>
      <span class="butterfly butterfly-one"></span>
      <span class="butterfly butterfly-two"></span>
      <span class="butterfly butterfly-three"></span>
      <span class="bee"></span>
    </div>

    <main>
      <header>
        <div>
          <h1>Elbise Stok Takip</h1>
          <p>GitHub'a girmeden ürün ekle, sil ve takip listesini gör.</p>
        </div>
        <div id="status" class="status">Bağlanıyor</div>
      </header>

      <div id="message" class="message"></div>

      <section>
        <h2>Ürün Ekle</h2>
        <form id="add-form">
          <label>
            Ürün linki veya kodu
            <input id="product" autocomplete="off" placeholder="https://... veya 1072453822" required />
          </label>
          <label>
            Alt fiyat
            <input id="min-price" inputmode="numeric" placeholder="500" required />
          </label>
          <label>
            Üst fiyat
            <input id="max-price" inputmode="numeric" placeholder="800" required />
          </label>
          <div class="actions">
            <button type="submit">Ürün Ekle</button>
            <button class="secondary" id="refresh" type="button">Yenile</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Takip Listesi</h2>
        <div id="products" class="list">
          <div class="empty">Liste yükleniyor.</div>
        </div>
      </section>
    </main>

    <script>
      const config = window.APP_CONFIG || {};
      const statusEl = document.querySelector("#status");
      const messageEl = document.querySelector("#message");
      const listEl = document.querySelector("#products");
      const formEl = document.querySelector("#add-form");
      const refreshEl = document.querySelector("#refresh");

      function apiUrl(path = "") {
        return `${config.supabaseUrl.replace(/\/$/, "")}/rest/v1/products${path}`;
      }

      function headers(extra = {}) {
        return {
          apikey: config.supabaseAnonKey,
          Authorization: `Bearer ${config.supabaseAnonKey}`,
          "Content-Type": "application/json",
          ...extra
        };
      }

      function showMessage(text, type = "ok") {
        messageEl.textContent = text;
        messageEl.className = `message ${type}`;
      }

      function clearMessage() {
        messageEl.textContent = "";
        messageEl.className = "message";
      }

      function productIdFrom(value) {
        const text = value.trim();
        const match = text.match(/-p-(\d+)/);
        if (match) return match[1];
        if (/^https?:\/\//i.test(text)) return "";
        return text.replace(/\D/g, "");
      }

      function rowTitle(row) {
        return row.name || row.product_id || row.product_url || "Ürün";
      }

      function renderProducts(rows) {
        if (!rows.length) {
          listEl.innerHTML = '<div class="empty">Henüz ürün yok.</div>';
          return;
        }

        listEl.innerHTML = rows
          .map((row) => {
            const price = `${Number(row.target_price_min)}-${Number(row.target_price_max)} TL`;
            const ref = row.product_url || row.product_id || row.id;
            return `
              <article class="product">
                <div>
                  <div class="title">${rowTitle(row)}</div>
                  <div class="meta">${price}</div>
                  <div class="meta">${ref}</div>
                </div>
                <button class="danger" data-id="${row.id}" type="button">Sil</button>
              </article>
            `;
          })
          .join("");
      }

      async function loadProducts() {
        clearMessage();
        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          statusEl.textContent = "Ayar eksik";
          listEl.innerHTML = '<div class="empty">Supabase ayarları yapılmamış.</div>';
          return;
        }

        statusEl.textContent = "Yükleniyor";
        const response = await fetch(apiUrl("?select=*&order=created_at.asc"), {
          headers: headers()
        });
        if (!response.ok) throw new Error("Liste alınamadı.");
        const rows = await response.json();
        renderProducts(rows);
        statusEl.textContent = `${rows.length} ürün`;
      }

      async function addProduct(event) {
        event.preventDefault();
        clearMessage();
        const productValue = document.querySelector("#product").value.trim();
        const minPrice = Number(document.querySelector("#min-price").value.replace(",", "."));
        const maxPrice = Number(document.querySelector("#max-price").value.replace(",", "."));

        if (!productValue || !Number.isFinite(minPrice) || !Number.isFinite(maxPrice)) {
          showMessage("Ürün ve fiyat aralığını doldur.", "err");
          return;
        }

        const payload = {
          product_url: /^https?:\/\//i.test(productValue) ? productValue : "",
          product_id: productIdFrom(productValue),
          target_price_min: minPrice,
          target_price_max: maxPrice
        };

        const response = await fetch(apiUrl(), {
          method: "POST",
          headers: headers({ Prefer: "return=minimal" }),
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error("Ürün eklenemedi.");

        formEl.reset();
        showMessage("Ürün takip listesine eklendi.");
        await loadProducts();
      }

      async function removeProduct(id) {
        clearMessage();
        const response = await fetch(apiUrl(`?id=eq.${encodeURIComponent(id)}`), {
          method: "DELETE",
          headers: headers()
        });
        if (!response.ok) throw new Error("Ürün silinemedi.");
        showMessage("Ürün listeden silindi.");
        await loadProducts();
      }

      formEl.addEventListener("submit", (event) => {
        addProduct(event).catch((error) => showMessage(error.message, "err"));
      });

      refreshEl.addEventListener("click", () => {
        loadProducts().catch((error) => showMessage(error.message, "err"));
      });

      listEl.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-id]");
        if (!button) return;
        removeProduct(button.dataset.id).catch((error) => showMessage(error.message, "err"));
      });

      loadProducts().catch((error) => showMessage(error.message, "err"));
    </script>
  </body>
</html>
